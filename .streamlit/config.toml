# RosterWatch dashboard theme. Streamlit reads this file when the app is
# started from the repository root:
#     streamlit run frontend/streamlit_app/app.py
#
# The blue gradient and card colors are set in the CSS at the top of
# frontend/streamlit_app/app.py. A dark base keeps Streamlit's own tables
# and widgets readable on that background even when the viewer's computer
# is in light mode. Fonts are Streamlit's default.

[theme]
base = "dark"
